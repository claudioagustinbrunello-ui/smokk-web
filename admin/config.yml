backend:
  name: git-gateway
  branch: main

media_folder: "material/imagenes"
public_folder: "/material/imagenes"

locale: es

collections:
  # ---------- REDES, BIO Y VIDEO ----------
  - name: "site"
    label: "Sitio (bio, redes, video)"
    files:
      - name: "site"
        label: "Configuración general"
        file: "content/site.json"
        fields:
          - { label: "Biografía (un párrafo por línea)", name: "bio", widget: "list", field: { label: "Párrafo", name: "parrafo", widget: "text" } }
          - label: "Redes sociales"
            name: "redes"
            widget: "list"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Video destacado"
            name: "videoDestacado"
            widget: "object"
            fields:
              - { label: "URL de YouTube", name: "url", widget: "string", required: false }

  # ---------- LANZAMIENTOS / COLABS ----------
  - name: "lanzamientos"
    label: "Lanzamientos / Colabs"
    files:
      - name: "lanzamientos"
        label: "Lista de lanzamientos"
        file: "content/lanzamientos.json"
        fields:
          - label: "Lanzamientos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text", required: false }
              - { label: "Enlace", name: "enlace", widget: "string", required: false }
              - { label: "Fecha (opcional, para programar)", name: "fecha", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }

  # ---------- CANCIONES ----------
  - name: "canciones"
    label: "Canciones"
    files:
      - name: "lista"
        label: "Lista de canciones"
        file: "material/canciones/lista.json"
        fields:
          - label: "Canciones"
            name: "items"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Archivo MP3 (nombre exacto)", name: "archivo", widget: "string" }
