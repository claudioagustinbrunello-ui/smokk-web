<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMOKK — Experiencia musical</title>
  <meta name="description" content="SMOKK — Artista, productor y compositor de Catamarca, Argentina." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>

  <!-- PANTALLA DE ENTRADA -->
  <section id="intro" class="intro">
    <div class="intro-content">
      <h1>SMOKK</h1>
      <p>Experiencia musical</p>
      <div class="intro-botones">
        <button id="btn-con-musica" class="btn btn-primario">Entrar con música</button>
        <button id="btn-sin-musica" class="btn btn-secundario">Entrar sin música</button>
      </div>
    </div>
  </section>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="contenido" class="oculto">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-texto">
        <p class="etiqueta">ARTISTA · PRODUCTOR · CATAMARCA</p>
        <h1>SMOKK</h1>
        <p class="subtitulo">El sonido, más allá del beat.</p>
      </div>
    </section>

    <!-- REPRODUCTOR -->
    <section class="seccion reproductor">
      <h2>Sonando ahora</h2>
      <div id="player" class="player">
        <p id="player-titulo" class="player-titulo">—</p>
        <div class="player-controles">
          <button id="btn-play" class="btn-icono" aria-label="Reproducir">▶</button>
          <button id="btn-next" class="btn-icono" aria-label="Siguiente">⏭</button>
        </div>
        <p id="player-estado" class="player-estado"></p>
      </div>
    </section>

    <!-- BIOGRAFÍA -->
    <section class="seccion bio">
      <h2>Una historia. Muchas frecuencias.</h2>
      <div id="bio-texto" class="bio-texto"></div>
    </section>

    <!-- GALERÍA -->
    <section class="seccion galeria">
      <h2>Otros planos</h2>
      <div id="galeria-grid" class="galeria-grid"></div>
    </section>

    <!-- COLABORACIONES / LANZAMIENTOS -->
    <section class="seccion lanzamientos">
      <h2>Algunas collabs</h2>
      <div id="lanzamientos-grid" class="lanzamientos-grid"></div>
    </section>

    <!-- VIDEO DESTACADO -->
    <section class="seccion video">
      <h2>Último estreno</h2>
      <div id="video-contenedor" class="video-contenedor"></div>
    </section>

    <!-- REDES -->
    <section class="seccion redes">
      <h2>Encontralo en plataformas</h2>
      <div id="redes-grid" class="redes-grid"></div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© <span id="anio"></span> SMOKK · Catamarca, Argentina</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
